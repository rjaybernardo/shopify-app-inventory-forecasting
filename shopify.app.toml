# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "9791b74276a0aa2b2752f186ffaf8a48"
name = "inventory-forecasting"
application_url = "https://example.com"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# read_orders covers the last 60 days of orders, which bounds the lookback window.
scopes = "read_products,read_inventory,read_orders"

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  # Disabled until protected customer data access is granted in the Partner Dashboard
  # (orders webhooks are blocked without it). Sync and the daily cron still pick up orders.
  # [[webhooks.subscriptions]]
  # uri = "/webhooks/orders"
  # topics = [ "orders/create", "orders/updated", "orders/cancelled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/inventory"
  topics = [ "inventory_levels/update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

[auth]
redirect_urls = [ "https://example.com/api/auth" ]

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true
